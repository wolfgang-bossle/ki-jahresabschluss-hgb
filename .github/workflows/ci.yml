# CI — spiegelt das lokale Commit-Gate serverseitig: erst die Wahrheits-Verifikation
# (Anker/Bilanzprobe, scripts/verify.py), dann das dependency-freie Testnetz (tests/run.py).
# Eines rot -> Build rot. Kein pytest/Framework nötig; openpyxl (Engine) + reportlab
# (PDF-Renderer-Tests; fehlt es, überspringen jene Tests sauber statt zu crashen).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-und-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip openpyxl reportlab jsonschema
      - name: Verifikation (Anker & Bilanzprobe)
        run: python scripts/verify.py
      - name: Testnetz
        run: python tests/run.py
